<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Analyzer - Knowledge Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <header class="top-nav">
        <div class="brand">
            <div class="logo-icon">🎬</div>
            <div class="brand-text">
                <h1>Reel Analyzer</h1>
                <span class="subtitle">Knowledge Dashboard</span>
            </div>
        </div>
        <div class="header-actions">
            <input type="text" id="searchInput" placeholder="Search insights, tools, or tags..." autocomplete="off">
            <button id="btnSync" class="btn btn-primary">&#x21BB; Sync from Extension</button>
        </div>
    </header>

    <div class="layout-wrapper">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-section">
                <h2>Categories</h2>
                <!-- dashboard.js renders category items here -->
                <div id="categorySidebar"></div>
            </div>

            <!-- AD SLOT: 300x250 rectangle -->
            <div id="ad-sidebar" class="ad-placeholder sidebar-ad">
                <span class="ad-label">Advertisement</span>
            </div>

            <button id="btnDownloadPlaybook" class="btn btn-secondary btn-full-width" style="margin-top:12px;">
                &#x2B07; Download Playbook
            </button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- TAB BUTTONS - IDs must match dashboard.js -->
            <div class="tabs">
                <button class="tab-btn active" id="btnTabReels">&#x1F4DA; Reels Library</button>
                <button class="tab-btn" id="btnTabTools">&#x1F6E0; Tools &amp; Entities Directory</button>
            </div>

            <!-- AD SLOT: 728x90 leaderboard banner -->
            <div id="ad-banner-top" class="ad-placeholder banner-ad">
                <span class="ad-label">Advertisement</span>
            </div>

            <!-- dashboard.js renders all content (reels grid OR tools table) into this div -->
            <div id="mainContent"></div>

        </main>
    </div>

    <footer>
        <p>Reel Analyzer v1.1 | Built for personal knowledge management</p>
    </footer>

    <script src="dashboard.js"></script>
</body>
</html>
